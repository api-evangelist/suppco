aid: suppco
name: SuppCo
description: SuppCo is a consumer supplement tracking and optimization platform, describing itself as
  the world's first real supplement tracker and optimizer. Its iOS and Android app lets people log their
  supplement stack and get a personalized StackScore across quality, dosing, goal coverage, and nutrient
  levels, plus a TrustScore that rates products on 29 attributes. It is backed by a database of 160,000+
  products, 20,000+ research studies, and 80+ expert protocols from functional-medicine practitioners.
  SuppCo is in open beta (free, with an optional Pro tier) and was acquired by Function Health. No public
  developer API, OpenAPI, or developer portal is currently published; this profile captures its public
  web, security, and legal surface. Surfaced as a portfolio company of Union Square Ventures.
